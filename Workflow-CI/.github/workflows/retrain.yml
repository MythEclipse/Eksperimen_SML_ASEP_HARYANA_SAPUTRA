name: Retraining CI — MLflow Project

on:
  push:
    branches:
      - main
    paths:
      - "preprocessing/pokerhand_preprocessing/**"
      - "Workflow-CI/**"
  workflow_dispatch:
    inputs:
      n_estimators:
        description: "Number of trees in RandomForest"
        required: false
        default: "200"
      max_depth:
        description: "Max depth per tree"
        required: false
        default: "15"

jobs:
  retrain:
    name: Retrain Model via MLflow Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install MLflow and dependencies
        run: |
          pip install mlflow>=2.10 scikit-learn>=1.3 pandas>=2.0 numpy>=1.24 \
            imbalanced-learn>=0.11 joblib>=1.3 matplotlib>=3.7 seaborn>=0.12

      - name: Copy preprocessed data into MLProject directory
        run: |
          mkdir -p Workflow-CI/MLProject/pokerhand_preprocessing
          cp preprocessing/pokerhand_preprocessing/*.csv \
             Workflow-CI/MLProject/pokerhand_preprocessing/

      - name: Run MLflow Project
        run: |
          cd Workflow-CI/MLProject
          mlflow run . \
            --no-conda \
            -P n_estimators=${{ github.event.inputs.n_estimators || '200' }} \
            -P max_depth=${{ github.event.inputs.max_depth || '15' }}

      - name: List MLflow artifacts
        run: |
          echo "MLflow runs:"
          ls -la Workflow-CI/MLProject/mlruns/ || true
          find Workflow-CI/MLProject/mlruns -name "*.png" -o -name "*.txt" | head -20

      - name: Upload MLflow run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-run-${{ github.run_number }}
          path: Workflow-CI/MLProject/mlruns/
          retention-days: 90

      - name: Create GitHub Release with model artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: model-v${{ github.run_number }}
          name: "Model Retrain Run #${{ github.run_number }}"
          body: |
            Automated retraining via MLflow Project.
            - n_estimators: ${{ github.event.inputs.n_estimators || '200' }}
            - max_depth: ${{ github.event.inputs.max_depth || '15' }}
          files: |
            Workflow-CI/MLProject/mlruns/**/*.png
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image (mlflow build-docker)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -z "$DOCKER_USERNAME" ]; then
            echo "Set DOCKER_USERNAME and DOCKER_PASSWORD in GitHub Secrets to enable docker push"
            exit 0
          fi
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

          # Find the MLmodel directory generated by mlflow run
          MODEL_PATH=$(find Workflow-CI/MLProject/mlruns -name "model" -type d | head -n 1)
          if [ -n "$MODEL_PATH" ]; then
            echo "Building docker image for model at $MODEL_PATH"
            mlflow models build-docker -m "$MODEL_PATH" -n "$DOCKER_USERNAME/pokerhand-model:latest"
            docker push "$DOCKER_USERNAME/pokerhand-model:latest"
          else
            echo "Model directory not found. Skipping docker build."
          fi
