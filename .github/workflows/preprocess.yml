name: ML Pipeline — Poker Hand (Full Auto)

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ml-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    steps:
      - name: 1. Fetch Repository Contents
        uses: actions/checkout@v4

      - name: 2. Initialize Python Environment (3.11)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 3. Install All Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install dagshub

      - name: 4. Execute Data Preprocessing Pipeline
        run: |
          python preprocessing/automate_ASEP_HARYANA_SAPUTRA.py \
            --raw-dir pokerhand_raw \
            --out-dir preprocessing/pokerhand_preprocessing \
            --test-size 0.2

      - name: 5. Execute ML Model Training & Tuning (Sync to DagsHub)
        run: |
          python Membangun_model/modelling_tuning.py \
            --tracking-uri https://dagshub.com/mytheclipse/Eksperimen_SML_ASEP_HARYANA_SAPUTRA.mlflow
        env:
          MLFLOW_TRACKING_USERNAME: mytheclipse
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}

      - name: 6. Extract MLflow Analytics (Run ID)
        id: run_id
        run: |
          python -c "
          import mlflow, os
          mlflow.set_tracking_uri('https://dagshub.com/mytheclipse/Eksperimen_SML_ASEP_HARYANA_SAPUTRA.mlflow')
          try:
              # Modelling tuning defaults to 'poker-hand-tuning'
              experiment = mlflow.get_experiment_by_name('poker-hand-tuning')
              if not experiment:
                  experiment = mlflow.get_experiment_by_name('Default')
              
              runs = mlflow.search_runs(experiment_ids=[experiment.experiment_id], order_by=['attribute.start_time DESC'], max_results=1)
              if not runs.empty:
                  run_id = runs.iloc[0]['run_id']
                  print(f'RUN_ID={run_id}')
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                      f.write(f'RUN_ID={run_id}\\n')
          except Exception as e:
              print(f'Metadata extraction error: {e}')
          "
        env:
          MLFLOW_TRACKING_USERNAME: mytheclipse
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}

      - name: 7. Synchronize Preprocessed Artifacts
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add preprocessing/pokerhand_preprocessing/
          git diff --quiet && git diff --staged --quiet || (git commit -m "ci: automated data update [runID ${{ steps.run_id.outputs.RUN_ID }}]" && git push)

      - name: 8. Build and Push Production Docker Image
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development'
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker build -t ${{ secrets.DOCKER_USERNAME }}/pokerhand-model:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/pokerhand-model:latest
