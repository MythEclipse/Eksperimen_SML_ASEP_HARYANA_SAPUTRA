name: ML Pipeline — Poker Hand (Full Auto)

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ml-pipeline:
    runs-on: ubuntu-latest
    env:
      DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Check Env
        run: |
          echo "GitHub User: ${{ github.actor }}"
          echo "Project Root: $(pwd)"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install mlflow dagshub

      - name: Preprocessing Data
        run: |
          python preprocessing/automate_ASEP_HARYANA_SAPUTRA.py \
            --raw-dir pokerhand_raw \
            --out-dir preprocessing/pokerhand_preprocessing \
            --test-size 0.2

      - name: Run MLflow Training (Sync to DagsHub)
        run: |
          python -c "
          import dagshub
          import mlflow
          import os
          dagshub.init(repo_owner='mytheclipse', repo_name='Eksperimen_SML_ASEP_HARYANA_SAPUTRA', setup_mlflow=True)
          os.system('python Membangun_model/modelling_tuning.py')
          "
        env:
          MLFLOW_TRACKING_USERNAME: mytheclipse
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}

      - name: Get Latest MLflow Run ID
        id: run_id
        run: |
          python -c "
          import mlflow
          from mlflow.tracking import MlflowClient
          client = MlflowClient()
          experiment = client.get_experiment_by_name('Default')
          runs = client.search_runs(experiment_ids=[experiment.experiment_id], order_by=['attribute.start_time DESC'], max_results=1)
          if runs:
              print(f'RUN_ID={runs[0].info.run_id}')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write(f'RUN_ID={runs[0].info.run_id}\n')
          "

      - name: Commit & Push Changes
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add preprocessing/pokerhand_preprocessing/
          git diff --quiet && git diff --staged --quiet || (git commit -m "ci: automated data update [runID ${{ steps.run_id.outputs.RUN_ID }}]" && git push)

      - name: Build and Push Docker Image
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development'
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker build -t ${{ secrets.DOCKER_USERNAME }}/pokerhand-model:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/pokerhand-model:latest
