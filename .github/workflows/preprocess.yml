name: ML Pipeline — Poker Hand (Full Auto)

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ml-pipeline:
    runs-on: ubuntu-latest
    env:
      DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    steps:
      - name: 1. Fetch Repository Contents
        uses: actions/checkout@v4

      - name: 2. Initialize Python Environment (3.11)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 3. Verify GitHub Environment
        run: |
          echo "GitHub Actor: ${{ github.actor }}"
          echo "Workspace: ${{ github.workspace }}"

      - name: 4. Upgrade Package Installer (Pip)
        run: pip install --upgrade pip

      - name: 5. Install Project Dependencies
        run: pip install -r requirements.txt

      - name: 6. Provision ML Infrastructure (MLflow/DagsHub)
        run: pip install mlflow dagshub

      - name: 7. Execute Data Preprocessing Pipeline
        run: |
          python preprocessing/automate_ASEP_HARYANA_SAPUTRA.py \
            --raw-dir pokerhand_raw \
            --out-dir preprocessing/pokerhand_preprocessing \
            --test-size 0.2

      - name: 8. Initialize DagsHub MLflow Tracking
        run: |
          python -c "
          import dagshub
          dagshub.init(repo_owner='mytheclipse', repo_name='Eksperimen_SML_ASEP_HARYANA_SAPUTRA', setup_mlflow=True)
          "
        env:
          MLFLOW_TRACKING_USERNAME: mytheclipse
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}

      - name: 9. Execute ML Model Training & Tuning
        run: python Membangun_model/modelling_tuning.py
        env:
          MLFLOW_TRACKING_USERNAME: mytheclipse
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}

      - name: 10. Extract MLflow Analytics (Run ID)
        id: run_id
        run: |
          python -c "
          import mlflow
          from mlflow.tracking import MlflowClient
          import os
          client = MlflowClient()
          try:
              experiment = client.get_experiment_by_name('Default')
              runs = client.search_runs(experiment_ids=[experiment.experiment_id], order_by=['attribute.start_time DESC'], max_results=1)
              if runs:
                  print(f'RUN_ID={runs[0].info.run_id}')
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                      f.write(f'RUN_ID={runs[0].info.run_id}\\n')
          except Exception as e:
              print(f'Metadata extraction error: {e}')
          "

      - name: 11. Synchronize Preprocessed Artifacts
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add preprocessing/pokerhand_preprocessing/
          git diff --quiet && git diff --staged --quiet || (git commit -m "ci: automated data update [runID ${{ steps.run_id.outputs.RUN_ID }}]" && git push)

      - name: 12. Authenticate Docker Container Registry
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development'
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: 13. Build Production Docker Image
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development'
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/pokerhand-model:latest .

      - name: 14. Dispatch Image to Docker Hub
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development'
        run: docker push ${{ secrets.DOCKER_USERNAME }}/pokerhand-model:latest
