name: Preprocessing Pipeline — Poker Hand

on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:
    inputs:
      test_size:
        description: 'Test split fraction (0.0–0.5)'
        required: false
        default: '0.2'
      apply_smote:
        description: 'Apply SMOTE balancing (true/false)'
        required: false
        default: 'true'

jobs:
  preprocess:
    name: Run Preprocessing Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run preprocessing automation script
        run: |
          python preprocessing/automate_ASEP_HARYANA_SAPUTRA.py \
            --raw-dir pokerhand_raw \
            --out-dir preprocessing/pokerhand_preprocessing \
            --test-size ${{ github.event.inputs.test_size || '0.2' }} \
            ${{ github.event.inputs.apply_smote == 'false' && '--no-smote' || '' }}

      - name: Verify output files
        run: |
          echo "Checking output files:"
          ls -lh preprocessing/pokerhand_preprocessing/
          python -c "
          import pandas as pd
          X_train = pd.read_csv('preprocessing/pokerhand_preprocessing/X_train.csv')
          X_test  = pd.read_csv('preprocessing/pokerhand_preprocessing/X_test.csv')
          y_train = pd.read_csv('preprocessing/pokerhand_preprocessing/y_train.csv')
          y_test  = pd.read_csv('preprocessing/pokerhand_preprocessing/y_test.csv')
          print(f'X_train: {X_train.shape}, X_test: {X_test.shape}')
          print(f'y_train: {y_train.shape}, y_test: {y_test.shape}')
          print('Class distribution (y_train):')
          print(y_train[\"CLASS\"].value_counts().sort_index())
          "

      - name: Upload preprocessed data as artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokerhand-preprocessed-${{ github.run_number }}
          path: preprocessing/pokerhand_preprocessing/
          retention-days: 30

      - name: Commit updated preprocessed data (on push to main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add preprocessing/pokerhand_preprocessing/
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "ci: update preprocessed data [run ${{ github.run_number }}]"
          git push
