groups:
  - name: poker_hand_model_alerts
    interval: 30s
    rules:
      # Alert 1: High error rate
      - alert: ModelHighErrorRate
        expr: >
          rate(model_errors_total[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High model error rate detected"
          description: >
            Model error rate is {{ $value | humanizePercentage }} per second
            over the last 5 minutes. Threshold: 0.05/s.

      # Alert 2: High response latency (p95 > 500ms)
      - alert: ModelHighLatency
        expr: >
          histogram_quantile(0.95, rate(model_response_latency_seconds_bucket[5m])) > 0.5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Model p95 response latency exceeds 500ms"
          description: >
            95th percentile latency is {{ $value | humanizeDuration }}.
            This may indicate resource exhaustion or model complexity increase.

      # Alert 3: Data drift score too high
      - alert: ModelDataDriftHigh
        expr: >
          model_data_drift_score_gauge > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Input data drift detected"
          description: >
            PSI drift score is {{ $value }}, exceeding threshold 0.2.
            Model retraining may be required.
