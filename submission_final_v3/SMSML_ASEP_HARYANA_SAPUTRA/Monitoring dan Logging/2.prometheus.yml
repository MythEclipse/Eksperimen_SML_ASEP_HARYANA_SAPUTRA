global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# Alertmanager configuration
# Uncomment and configure when running Grafana Alertmanager
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# Alert rules (reference to rules file)
rule_files:
  - "alert_rules.yml"

# Scrape configurations
scrape_configs:
  # -----------------------------------------------------------------------
  # 1. Poker Hand Model Exporter (prometheus_exporter.py)
  # -----------------------------------------------------------------------
  - job_name: "poker_hand_model"
    static_configs:
      - targets: ["model-exporter:8000"]
    metrics_path: "/metrics"
    scrape_interval: 10s
    scrape_timeout: 8s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - target_label: dataset
        replacement: poker_hand_uci
      - target_label: author
        replacement: ASEP_HARYANA_SAPUTRA

  # -----------------------------------------------------------------------
  # 2. Prometheus self-monitoring
  # -----------------------------------------------------------------------
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # -----------------------------------------------------------------------
  # 3. Node Exporter (host system metrics) — optional
  #    Install: apt install prometheus-node-exporter
  # -----------------------------------------------------------------------
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
    scrape_interval: 30s
